<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lex Detetive</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-app-region:drag}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
    background:radial-gradient(120% 120% at 20% 0%,#163E7A 0%,#0B1F3A 55%,#071427 100%);overflow:hidden}
  .logo{width:104px;height:104px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45));animation:pop .6s cubic-bezier(.2,.8,.2,1)}
  h1{margin:22px 0 2px;font-size:26px;font-weight:700;letter-spacing:.2px}
  .sub{font-size:10.5px;letter-spacing:.32em;color:#C9A227}
  .bar{margin-top:34px;width:220px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#C9A227,#E8C964);border-radius:3px;animation:slide 1.3s ease-in-out 30}
  #status{margin-top:12px;font-size:12px;color:rgba(255,255,255,.7);min-height:16px}
  .ver{position:absolute;bottom:14px;font-size:10px;color:rgba(255,255,255,.4)}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style></head>
<body>
  <img class="logo" src="assets/logo-mark.svg" alt="">
  <h1>Lex Detetive</h1>
  <div class="sub">LEX TECNOLOGIAS</div>
  <div class="bar"><i></i></div>
  <div id="status">Iniciando…</div>
  <div class="ver" id="ver"></div>
  <script>
    function setStatus(t){document.getElementById('status').textContent=t}
    var v=new URLSearchParams(location.search).get('v'); if(v) document.getElementById('ver').textContent='versão '+v+' · investigação jurídica inteligente';
  </script>
</body></html>
